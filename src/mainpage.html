<!doctype html>
<html lang="en">
  <head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css">

  <style>
    .card-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 240px;
      height: 120px;
    }

    @media (max-width: 1030px) {
      .card-wrap {
        width: 280px;
        height: 160px;
      }
    }
  </style>
  <body>

      <div class="head-container">
        <a class="logo"
            href="mainpage.html">Vemure Homebrew</a>
      </div>

    <main class="w-full h-[calc(100vh-120px)]">
      <div class="w-full h-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 items-center gap-4 p-16">
        <div class="card-wrap">
          <a
            class="card"
            href="equipment.html"
          >
            <span class="title">Equipments</span>
          </a>
        </div>
        <div class="card-wrap">
          <a
            class="card"
            href="skills.html"
          >
            <span class="title">Skills</span>
          </a>
        </div>
        <div class="card-wrap">
          <a
            class="card"
            href="traits.html"
          >
            <span class="title">Traits</span>
          </a>
        </div>
        <div class="card-wrap">
          <a
            class="card"
            href="core.html"
          >
            <span class="title">Core</span>
          </a>
        </div>
