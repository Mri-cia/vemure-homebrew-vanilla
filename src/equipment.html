<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vemure Homebrew</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="output.css">
</head>
<style>
    nav div {
        width: 100%;
        padding: 0.5em 0;
        text-align: center;
        font-weight: bold;
    }

    nav div:hover {
        cursor: pointer;
        background-color: rgb(var(--accent-color) / 0.3);
        transition: 0.3s;
    }

    nav div.active {
        background-color: rgb(var(--accent-color));
        color: rgb(var(--primary-color));
    }


</style>
<body>
    <header class="bot-seperation-line">
      <div class="head-container">
        <a class="logo"
            href="mainpage.html">Vemure Homebrew</a>
      </div>
    </header>
    <nav class="my-6 mx-8 grid grid-cols-3 border border-[rgb(var(--accent-color),0.5)]">
        <div class="active">Melee</div>
        <div>Ranged</div>
        <div>Ammunition</div>
    </nav>
    <main>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Damage</th>
                <th>Parry</th>
                <th>ST</th>
                <th>Cost</th>
                <th>Weight</th>
                <th>TL</th>
            </tr>
        </table>
    </main>
    <footer>
        <a class="add-button" href="\creation-form.html">
            <span class="material-symbols-outlined font-bold!">
                add
            </span>
        </a>
    </footer>

</body>
</html>
