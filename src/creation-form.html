<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weapon Creation</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="output.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <style>

    main input, main textarea {
      background-color: white !important;
      border-radius: 2px;
    }

  </style>
  <body>
    <header class="bot-seperation-line">
      <div class="head-container">
        <a class="logo" href="mainpage.html">Vemure Homebrew</a>
      </div>
    </header>
    <main class="h-[calc(100vh-120px)] flex justify-center items-center ">
      <div class="border border-[rgb(var(--accent-color),0.5)]">
        <form class="card-form">
          <h3 class="py-4 text-lg font-bold">Creation</h3>
          <div class="grid grid-cols-[1fr_3fr] gap-y-2 gap-x-4">
              <label for="">Name</label>
              <input type="text" />

              <label for="">Damage</label>
              <input type="text" />

              <label for="">Parry</label>
              <input type="text" />

              <label for="">ST</label>
              <input type="text" />

              <label for="">Cost</label>
              <input type="text" />

              <label for="">Weight</label>
              <input type="text" />

              <label for="">Tl</label>
              <input type="text" />

              <label for="">Description</label>
              <textarea name="" id=""></textarea>

              <p class="text-red-400" id="warning-text"></p>

              <div class="my-4 h-2/3 flex flex-row col-span-2 justify-end items-center gap-2">
                <button type="reset" class="delete-button">Reset</button>
                <button type="submit" class="submit-button">Submit</button>
              </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
